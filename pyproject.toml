[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cnmaestro-migrate"
version = "0.1.0"
description = "Move devices from Cambium cnMaestro Cloud to a cnMaestro On-Premises 6.0 controller"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Christian Schnatz" }]
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
cnmaestro-migrate = "cnmaestro_migrate.cli:main"

[project.urls]
Source = "https://github.com/cschnatz/cambium-cloud-migration"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
